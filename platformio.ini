; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
board_build.f_cpu = 24000000   ;set clock speed in Hz
build_flags = -D MODULE_ADDRESS=0x09
monitor_speed = 115200 
#extra_scripts = wait.py

#[env:devel]

[env:debug]
build_flags = -D MODULE_ADDRESS=0x08 -D DEBUG_OUTPUT

[env:modA1]
build_flags = -D MODULE_ADDRESS=0x08
release_type = "test"
extra_scripts =
  post:wait.py
[env:modA2]
build_flags = -D MODULE_ADDRESS=0x09
release_type = "test"
extra_scripts =
  post:wait.py
[env:modB1]
build_flags = -D MODULE_ADDRESS=0x0A
release_type = "test"
extra_scripts =
  post:wait.py
[env:modB2]
build_flags = -D MODULE_ADDRESS=0x0B
release_type = "test"
extra_scripts =
  post:wait.py